<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Urne Lampion - Dépliage en 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #f5f1e8; font-family: Georgia, serif; }
  #ui { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  button { font-family: Georgia, serif; font-size: 14px; padding: 10px 22px; border-radius: 10px; border: 1px solid #2b3a5c; background: #2b3a5c; color: #fff; cursor: pointer; }
  button:hover { background: #3f5585; }
  #legende { position: fixed; bottom: 70px; width: 100%; text-align: center; color: #7a7468; font-size: 14px; }
</style>
</head>
<body>
<div id="legende">Tirez doucement : la feuille devient l'urne.</div>
<div id="ui">
  <button id="play">Pause</button>
  <button id="replay">Rejouer</button>
  <button id="explode">Vue éclatée</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- Scène ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f1e8);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0.45, 0.32, 0.65);
camera.lookAt(0, 0.13, -0.04);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(1, 2, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ---------- Table ----------
const table = new THREE.Mesh(
  new THREE.CylinderGeometry(2.5, 2.5, 0.05, 48),
  new THREE.MeshStandardMaterial({ color: 0xcdb287, roughness: 0.9 })
);
table.position.y = -0.025;
table.receiveShadow = true;
scene.add(table);

// ---------- Dimensions de l'urne ----------
const L = 0.452;      // circonférence dépliée (m)
const H = 0.24;       // hauteur (m)
const R = L / (2 * Math.PI); // rayon final ≈ 0.072 m

// ---------- Texture bois procédurale ----------
function woodTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#dcc9a3'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 260; i++) {                    // grain du bois
    g.strokeStyle = `rgba(${150 + Math.random() * 40 | 0},${120 + Math.random() * 40 | 0},${70 + Math.random() * 30 | 0},${0.08 + Math.random() * 0.12})`;
    g.lineWidth = 1 + Math.random() * 2;
    g.beginPath();
    const x = Math.random() * 1024;
    g.moveTo(x, 0);
    g.bezierCurveTo(x + 8, 128, x - 8, 384, x + 4, 512);
    g.stroke();
  }
  for (let x = 0; x < 1024; x += 18) {               // motif kerf : traits de scie verticaux
    g.strokeStyle = 'rgba(90, 70, 40, 0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 512); g.stroke();
    g.strokeStyle = 'rgba(255, 244, 220, 0.5)';
    g.beginPath(); g.moveTo(x + 2, 0); g.lineTo(x + 2, 512); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ---------- Feuille kerf (paroi extérieure) ----------
const SEG = 220;
const wallGeo = new THREE.PlaneGeometry(L, H, SEG, 1);
const wall = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({
  map: woodTexture(), roughness: 0.65, side: THREE.DoubleSide
}));
wall.castShadow = true;
const wallGroup = new THREE.Group(); // reçoit la rotation "de la table vers debout"
wallGroup.add(wall);
scene.add(wallGroup);

// ---------- Manchon translucide intérieur ----------
const SLEEVE_SEG = 200;
const SLEEVE_L = L * 0.985;
const sleeveGeo = new THREE.PlaneGeometry(SLEEVE_L, H * 0.96, SLEEVE_SEG, 1);
const sleeveMat = new THREE.MeshStandardMaterial({
  color: 0xfdf6e8, roughness: 0.5, transparent: true, opacity: 0.85,
  side: THREE.DoubleSide, emissive: 0xffb45e, emissiveIntensity: 0
});
const sleeve = new THREE.Mesh(sleeveGeo, sleeveMat);
wallGroup.add(sleeve);

// ---------- Socle et couvercle ----------
const woodMat = new THREE.MeshStandardMaterial({ color: 0xd0ba8e, roughness: 0.5 });
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.078, 0.012, 48), woodMat);
base.castShadow = true; base.receiveShadow = true;
scene.add(base);
const lid = new THREE.Group();
const lidDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.078, 0.012, 48), woodMat);
lidDisc.castShadow = true;
const plug = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.016, 32),
  new THREE.MeshStandardMaterial({ color: 0xb8a06a, roughness: 0.4 }));
plug.position.y = 0.006;
lid.add(lidDisc, plug);
scene.add(lid);

// ---------- LED intérieure + halo ----------
const led = new THREE.PointLight(0xffb066, 0, 1.2, 1.5);
scene.add(led);
function glowSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255, 200, 120, 0.9)');
  grad.addColorStop(1, 'rgba(255, 200, 120, 0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, depthWrite: false
  }));
}
const halo = glowSprite();
halo.scale.set(0.9, 0.9, 1);
scene.add(halo);

// ---------- Carton ----------
const boxMat = new THREE.MeshStandardMaterial({ color: 0xb9a685, roughness: 0.95, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
const carton = new THREE.Mesh(new THREE.BoxGeometry(L * 1.15, 0.05, H * 1.3), boxMat);
carton.position.set(0.05, 0.05, 0);
scene.add(carton);

// ---------- La main stylisée ----------
const hand = new THREE.Group();
const skin = new THREE.MeshStandardMaterial({ color: 0xe8c9a8, roughness: 0.8 });
const palm = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 16), skin);
palm.scale.set(1, 0.55, 1.25);
const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.009, 0.07, 4, 12), skin);
finger.rotation.x = Math.PI / 2; finger.position.set(0, 0.01, -0.06);
const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, 0.16, 20), skin);
wrist.rotation.x = Math.PI / 2; wrist.position.set(0, 0.01, 0.1);
hand.add(palm, finger, wrist);
scene.add(hand);

// ---------- Étiquettes (vue éclatée) ----------
function label(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(43, 58, 92, 0.92)';
  g.beginPath(); g.roundRect(4, 8, 504, 48, 14); g.fill();
  g.fillStyle = '#fff'; g.font = '24px Georgia'; g.textAlign = 'center';
  g.fillText(text, 256, 40);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(0.26, 0.033, 1);
  return s;
}

// ---------- Enroulement de la feuille (involute) ----------
const basePos = wallGeo.attributes.position;
const sleevePos = sleeveGeo.attributes.position;
function wrapPoint(u, t, radius) {
  // u ∈ [-w/2, w/2] sur la feuille ; t ∈ [0,1] taux d'enroulement
  if (t < 1e-4) return { x: u, y: 0, z: 0 };
  const k = t / radius;
  const th = k * u;
  const s = 1 / k;
  return { x: s * Math.sin(th) * (radius / R), y: 0, z: s * (Math.cos(th) - 1) * (radius / R) };
}
function updateSheet(t) {
  // chaque couche met à jour TOUS ses sommets (2 rangées de (seg+1) points)
  const layers = [
    [wallGeo, basePos, SEG, L, R],
    [sleeveGeo, sleevePos, SLEEVE_SEG, SLEEVE_L, R - 0.006]
  ];
  for (const [geo, pos, seg, w, radius] of layers) {
    for (let i = 0; i < pos.count; i++) {
      const u = -w / 2 + ((i % (seg + 1)) / seg) * w;
      const p = wrapPoint(u, t, radius);
      pos.setX(i, p.x);
      pos.setZ(i, p.z);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }
  // la feuille se relève de "couchée sur la table" à "debout"
  wallGroup.rotation.x = (Math.PI / 2) * (1 - t);
  wallGroup.position.y = 0.012 + (H / 2) * t;
  // socle : du début de la feuille à plat vers le centre du fond de l'urne (axe en z = -R)
  base.position.lerpVectors(
    new THREE.Vector3(-L / 2, 0.006, 0),
    new THREE.Vector3(0, 0.006, -R), t);
  // couvercle : de l'autre bout de la feuille vers le centre du dessus de l'urne
  lid.position.lerpVectors(
    new THREE.Vector3(L / 2, 0.018, 0),
    new THREE.Vector3(0, 0.012 + H + 0.006, -R), t);
}

// ---------- Timeline (12 secondes, en boucle) ----------
const DUR = 12;
let playing = true, time = 0, exploded = false;
function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }

function applyTime(T) {
  // phases : 0-2 carton plat ; 2-4 main entre ; 4-8 traction ; 8-9 main sort ; 9-12 lumière
  const deploy = ease((T - 4) / 4);
  updateSheet(deploy);
  // carton s'estompe
  boxMat.opacity = 0.55 * (1 - ease((T - 1.8) / 0.8));
  carton.position.y = 0.05 + 0.02 * ease((T - 1.8) / 0.8);
  // main : entre à 2 s, saisit le couvercle, le suit, sort à 8,5 s
  const handVis = T > 2 && T < 8.6;
  hand.visible = handVis && !exploded;
  hand.position.set(lid.position.x, lid.position.y + 0.045, lid.position.z + 0.02);
  // lumière
  const glow = ease((T - 8.8) / 1.4) * (T > 8.8 ? 1 : 0);
  led.intensity = 2.2 * glow;
  led.position.set(lid.position.x * 0.3, Math.max(0.06, lid.position.y - 0.08), lid.position.z * 0.3);
  sleeveMat.emissiveIntensity = 1.4 * glow;
  halo.material.opacity = 0.75 * glow;
  halo.position.set(lid.position.x, lid.position.y + 0.03, lid.position.z);
  // caméra : légère orbite lente
  const a = 0.25 * Math.sin(T / 12 * Math.PI * 2);
  if (!exploded) {
    camera.position.x = 0.45 * Math.cos(a);
    camera.position.z = 0.65 * Math.cos(a) - 0.2 * Math.sin(a);
    camera.lookAt(0, 0.13, -0.04);
  }
}

// ---------- Vue éclatée ----------
const labels = [
  ['Feuille kerf (bouleau 4 mm)', 0, 0.30, 0],
  ['Manchon translucide intérieur', -0.28, 0.16, 0],
  ['Socle + LED chaude', 0.28, 0.06, 0],
  ['Couvercle + bouchon', 0, 0.44, 0.28],
].map(([t, x, y, z]) => { const l = label(t); l.position.set(x, y, z); l.visible = false; scene.add(l); return l; });

function setExploded(on) {
  exploded = on;
  playing = !on;
  document.getElementById('play').textContent = on ? 'Lecture' : 'Pause';
  wall.visible = sleeve.visible = base.visible = lid.visible = true;
  labels.forEach(l => l.visible = on);
  if (on) {
    updateSheet(0.55); wallGroup.position.y += 0.14;         // feuille à demi enroulée, en hauteur
    sleeve.position.set(-0.12, 0, 0.01);                     // manchon écarté
    base.position.set(0.12, 0.01, 0.02);
    lid.position.set(0, 0.40, 0.12);
    hand.visible = false; boxMat.opacity = 0;
    camera.position.set(0.7, 0.5, 0.9); camera.lookAt(0, 0.2, -0.04);
  } else {
    time = 0; updateSheet(0); sleeve.position.set(0, 0, 0);
    camera.position.set(0.45, 0.32, 0.65); camera.lookAt(0, 0.13, -0.04);
  }
}

// ---------- Contrôles ----------
document.getElementById('play').onclick = e => {
  if (exploded) setExploded(false);
  playing = !playing; e.target.textContent = playing ? 'Pause' : 'Lecture';
};
document.getElementById('replay').onclick = () => { if (exploded) setExploded(false); time = 0; playing = true; document.getElementById('play').textContent = 'Pause'; };
document.getElementById('explode').onclick = () => setExploded(!exploded);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Boucle ----------
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    time = (time + dt) % DUR;
    applyTime(time);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
updateSheet(0);
applyTime(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
