<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliances — BALLIN Paris</title>
<meta name="description" content="Découvrez la collection Alliances BALLIN Paris : haute joaillerie façonnée à la main, or éthique et diamants certifiés. Livraison offerte, garantie à vie.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-cat="alliances">
<div id="header"></div>

<section class="page-banner">
  <div class="bg"><img id="catBanner" src="" alt="" onerror="this.onerror=null;this.src='assets/img/placeholder.svg'"></div>
  <div class="container">
    <div class="content">
      <p class="breadcrumb" id="catBreadcrumb"></p>
      <h1 id="catTitle"></h1>
      <p class="lead" id="catBaseline"></p>
    </div>
  </div>
</section>

<section class="section" style="padding-top:56px">
  <div class="container">
        <div class="filter-bar" id="filters">
      <div class="filter-bar-row">
        <span class="count" id="catCount"></span>
        <div class="filter-groups">
          <details class="fdrop"><summary>Prix</summary>
            <div class="fgroup">
              <label><input type="checkbox" data-f="price" value="0-2000"> Moins de 2 000 €</label>
              <label><input type="checkbox" data-f="price" value="2000-5000"> 2 000 € – 5 000 €</label>
              <label><input type="checkbox" data-f="price" value="5000+"> Plus de 5 000 €</label>
            </div>
          </details>
          <details class="fdrop"><summary>Métal</summary><div class="fgroup"><div id="fMetals"></div></div></details>
          <details class="fdrop"><summary>Pierre</summary><div class="fgroup"><div id="fGems"></div></div></details>
          <span id="subNav" class="subnav-chips"></span>
          <button class="link-u" id="clearFilters">Effacer</button>
        </div>
        <label class="sort-wrap">Trier :
          <select id="sortSel">
            <option value="default">Nouveautés</option>
            <option value="asc">Prix croissant</option>
            <option value="desc">Prix décroissant</option>
          </select>
        </label>
      </div>
    </div>
    <div class="grid-3 cat-grid" id="grid" style="grid-template-columns:repeat(3,1fr)"></div>
</section>

<!-- ================= CTA SUR-MESURE ================= -->
<section class="edito cat-edito">
  <img class="bg" src="assets/img/pages/atelier.jpg" alt="Création sur-mesure" onerror="this.onerror=null;this.src='assets/img/placeholder.svg'">
  <div class="container">
    <div class="content reveal">
      <p class="eyebrow">Sur-mesure</p>
      <h2>Cette pièce n'existe pas encore ? <em>Créons-la ensemble.</em></h2>
      <p class="lead">Rendez-vous privé avec nos conseillers : choix de la pierre, du métal, gravure offerte.</p>
      <a class="link-u light" href="contact.html">Prendre rendez-vous</a>
    </div>
  </div>
</section>

<div id="footer"></div>
<div id="cookie"></div>
<div id="toast-slot"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/category.js"></script>

</body>
</html>
